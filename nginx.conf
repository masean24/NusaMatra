# Single-page app: every unknown path serves index.html so client routes (/jelajahi, /bandingkan,
# /lab-prioritas, /paspor-bukti?…) work on reload. Hashed assets are cached for a year; the HTML never.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Text files ship with a maximum-compression .gz made at build time (scripts/precompress.mjs);
  # gzip_static sends it as is. Anything without one is compressed on the fly at level 6, not the
  # default 1, which left JavaScript about a fifth larger.
  gzip_static on;
  gzip on;
  gzip_comp_level 6;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
